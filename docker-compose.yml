services:
  xenith:
    image: ghcr.io/artykmyrat/xenith:latest
    restart: always
    env_file: .env
    network_mode: host
    # A proxy holds two descriptors per connection; the Docker default of 1024
    # runs out long before anything else does.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - /var/lib/marzban:/var/lib/marzban
